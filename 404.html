<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 Page Not Found – Voice.AI</title>
  <link rel="icon" type="image/png" href="assets/app-icon.png">
  <link rel="stylesheet" href="styles.css">
  <style>
    .not-found-container {
      min-height: 80vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 20px;
    }
    .not-found-code {
      font-size: 80px;
      font-weight: 800;
      color: rgba(255, 255, 255, 0.2);
      margin-bottom: 8px;
    }
    .not-found-title {
      font-size: 28px;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 16px;
    }
    .not-found-desc {
      font-size: 16px;
      color: rgba(255, 255, 255, 0.7);
      max-width: 480px;
      margin-bottom: 32px;
      line-height: 1.5;
    }
    .btn-return-home {
      display: inline-flex;
      align-items: center;
      padding: 12px 28px;
      border-radius: 9999px;
      background: #ffffff;
      color: #000000;
      font-weight: 600;
      text-decoration: none;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .btn-return-home:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(255, 255, 255, 0.2);
    }
  </style>
</head>
<body>
  <div class="not-found-container">
    <div class="not-found-code">404</div>
    <h1 class="not-found-title">Page Not Found</h1>
    <p class="not-found-desc">The page you were looking for doesn't exist or has moved. Return home to download Voice.AI or explore documentation.</p>
    <a href="index.html" class="btn-return-home">Back to Voice.AI</a>
  </div>
</body>
</html>
